<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="card">
            <div class="warning">⚠ Protótipo intencionalmente ruim</div>

            <h1>Login</h1>
            <p class="subtitle">Entre para continuar</p>

            <form id="formLogin" action="home.html" method="GET">
                <div class="form-group">
                    <label for="fname">Usuário:</label>
                    <input
                        type="text"
                        id="fname"
                        name="usuario"
                        placeholder="Usuário"
                    >
                </div>

                <div class="form-group">
                    <label for="lname">Senha:</label>
                    <input
                        type="password"
                        id="lname"
                        name="senha"
                        placeholder="Senha"
                    >
                </div>

                <button type="submit">Entrar</button>
            </form>

            <div class="link-row">
                <a href="login.html">Esqueci a senha</a>
                <a href="redef.html">Precisa de ajuda?</a>
            </div>

            <div class="register-link">
                <a href="index.html">Criar uma conta</a>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
